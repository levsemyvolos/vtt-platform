name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: type-check / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @vtt/server exec prisma generate

      # Type-check is the merge gate (M2 in session_chapter_3_kickoff). Failure
      # here blocks merge regardless of test/lint outcome.
      - name: Type check (gate)
        run: pnpm type-check

      # Lint and test run for visibility but are NOT merge gates yet — Чат 7.1/7.2
      # left a few pre-existing lint errors (unused imports, complexity > 10) that
      # are scheduled for cleanup in Чат 14 ("Test plan + cleanup PR"). Promote
      # to `run: pnpm lint` (no continue-on-error) once that chat lands.
      - name: Lint (non-gating)
        run: pnpm lint
        continue-on-error: true

      - name: Test
        run: pnpm test
