<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VTT Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#C8A24A" />
    <meta name="description" content="Web platform for tabletop RPG support — VTT з AI-помічником, WebRTC мешем, 3D-кубиками." />
  </head>
  <body>
    <!-- Wave 3.3 — Apply persisted theme BEFORE React renders to prevent auth-screen flash. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('preferences');
          if (raw) {
            var parsed = JSON.parse(raw);
            var theme = parsed && parsed.theme;
            if (theme === 'dark' || theme === 'light') {
              document.documentElement.dataset.theme = theme;
              return;
            }
          }
        } catch (_) {}
        // Fallback: respect system preference.
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
