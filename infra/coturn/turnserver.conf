# coturn 4.x configuration
# Used both locally (docker-compose) and on Oracle Cloud Always Free VPS
# Production: replace vtt.local with real domain, set real credentials

listening-port=3478
tls-listening-port=5349

# Replace with real external IP on Oracle VPS
# external-ip=<ORACLE_VPS_PUBLIC_IP>

realm=vtt.local
fingerprint
lt-cred-mech

# Replace with a strong secret in production
user=vtt:vtt_turn_secret_change_me

# Bandwidth / quota limits
total-quota=100
max-bps=3000000

# TLS certificates (Let's Encrypt on production VPS)
# cert=/etc/letsencrypt/live/<domain>/fullchain.pem
# pkey=/etc/letsencrypt/live/<domain>/privkey.pem

log-file=stdout
verbose
