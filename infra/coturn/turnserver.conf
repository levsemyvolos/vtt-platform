# ---------------------------------------------------------------------------
# coturn 4.x — VTT-platform TURN/STUN server
# Deployment: GCP e2-micro VM, us-central1-f (free trial $300)
# Auth: REST API per RFC 7635 + use-auth-secret. App Server (TurnConfigProvider)
#       issues HMAC-SHA1 short-lived credentials; coturn validates them against
#       `static-auth-secret`. Static long-term users disabled.
# Bible §2.2, deployment table 2.7/2.8.
# ---------------------------------------------------------------------------

# Listening ports (Deployment View, table 2.8 row 3).
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Public IP advertised in ALLOCATE responses. Required on NATed VMs.
# Replace with the static external IP of the VM (see README.md). Currently
# provisioned: 34.118.27.119 (us-central1-f).
external-ip=EXTERNAL_VM_IP

# Realm — server-side identity sent to clients via 401-challenge automatically.
# Not related to HMAC generation (RFC 7635 hashes username only, not realm).
realm=vtt.example.com

# REST API (RFC 7635). Username format: <expiry-unix-seconds>:<userId>.
use-auth-secret
static-auth-secret=REPLACE_WITH_TURN_STATIC_AUTH_SECRET

# TLS material — issued by Let's Encrypt via certbot --standalone.
cert=/etc/letsencrypt/live/turn.vtt.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.vtt.example.com/privkey.pem

# Hardening.
no-multicast-peers
no-cli
no-loopback-peers
no-tlsv1
no-tlsv1_1
fingerprint
stale-nonce=600

# Quotas (e2-micro: 1 vCPU, 1 GiB RAM — keep modest).
total-quota=100
user-quota=12
max-bps=3000000

# Deny RFC 1918 / link-local relay targets (anti-amplification).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Logging — systemd journal captures stderr; rotate by journald.
log-file=stdout
syslog
